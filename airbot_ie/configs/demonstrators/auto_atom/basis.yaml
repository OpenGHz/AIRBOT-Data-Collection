# @package _global_

batch_size: 2

demonstrator:
  _target_: airdc.common.demonstrators.single.SingleBatchedComponentDemonstrator
  # _target_: airdc.common.demonstrators.single.SingleComponentDemonstrator
  component:
    batch_size: ${batch_size}
    structured: true

log_jitter: false
visualizer:
  swap_rgb_bgr: true

sampler:
  av_coder:
    frame_format: rgb24
  task_info:
    operator: auto_atom
    station: mujoco
  writer:
    chunk_size: 1024 * 1024 * 16

sample_limit:
  size: 300
  # end_round: 300
  rounds: 1

# update as fast as possible for simulation since the actual update rate is determined by the simulation frequency
update_rate: 1000
