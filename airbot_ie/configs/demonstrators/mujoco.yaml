# @package _global_

demonstrator:
  _target_: airdc.common.demonstrators.single.SingleComponentDemonstrator
  component:
    _target_: airdc.common.systems.mujoco_env.MujocoEnv
    name: mujoco_env
    model_path: third_party/xml/scene_pick_place_demo.xml
    arm_mode: single
    sim_freq: 500
    update_freq: 20
    enabled_sensors:
      - camera
      - pose
      - tactile
      - joint_position
      - joint_velocity
      - joint_effort
    mask_objects: ["source_block", "target_pedestal"]
    operations: ["pick", "place", "push", "pull", "press"]
    interests:
      - ["source_block", "target_pedestal"]
      - ["pick", "place"]
    cameras:
      - name: hand_cam
        width: 1280
        height: 720
        enable_color: true
        enable_depth: true
        enable_mask: false
        enable_heat_map: true
      - name: front_cam
        width: 1280
        height: 720
        enable_color: true
        enable_depth: true
        enable_mask: false
        enable_heat_map: true
      - name: side_cam
        width: 1280
        height: 720
        enable_color: true
        enable_depth: true
        enable_mask: false
        enable_heat_map: true
    viewer:
      lookat: [0.04, 0.0, 0.1]
      distance: 0.55
      azimuth: 135
      elevation: -28
      step_delay: 0.03
      hold_seconds: 3.0
log_jitter: false
visualizer:
  swap_rgb_bgr: true
managers:
  self_manager:
    _target_: airdc.managers.basis.SelfManager
    on_reach: abandon
  auto_atom:
    _target_: airdc.managers.auto_atom.AutoAtomManager
    backend: auto_atom.sim.backend.mujoco_backend.build_mujoco_backend
    operators:
      - type: mujoco
        name: arm

sampler:
  av_coder:
    frame_format: rgb24

sample_limit:
  end_round: 0
  rounds: 1

# update as fast as possible for simulation since the actual update rate is determined by the simulation frequency
update_rate: 200
