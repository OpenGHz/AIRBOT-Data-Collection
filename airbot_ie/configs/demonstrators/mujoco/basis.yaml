# @package _global_

cam_width: 640
cam_height: 480
enable_depth: false
batch_size: 2

demonstrator:
  _target_: airdc.common.demonstrators.single.SingleBatchedComponentDemonstrator
  # _target_: airdc.common.demonstrators.single.SingleComponentDemonstrator
  component:
    _target_: airdc.common.systems.mujoco_env.BatchedMujocoEnv
    batch_size: ${batch_size}
    name: mujoco_env
    viewer:
      lookat: [0.04, 0.0, 0.1]
      distance: 0.55
      azimuth: 135
      elevation: -28
      step_delay: 0.03
      hold_seconds: 3.0
    operations: ["pick", "place", "push", "pull", "press"]

log_jitter: false
visualizer:
  swap_rgb_bgr: true

sampler:
  av_coder:
    frame_format: rgb24
  task_info:
    operator: auto_atom
    station: mujoco

sample_limit:
  # end_round: 300
  rounds: 1

# update as fast as possible for simulation since the actual update rate is determined by the simulation frequency
update_rate: 1
