      #   width: 640
      #   fps: 30
      #   enable_depth: true
      #   align_depth: true
      # - _target_: airbot_ie.robots.slamtec_athena2.SlamtecAthena2
      #   blocking: true
      #   rate: 50
    roles:
      - l
      - f
      - l
      - f
      - o
