version: 1
disable_existing_loggers: false

formatters:
  colorful:
    (): mcap_data_loader.utils.log.ColorfulFormatter

handlers:
  console:
    class: logging.StreamHandler
    formatter: colorful
    stream: ext://sys.stdout

root:
  level: INFO
  handlers: [ console ]

loggers:
  airdc:
    level: INFO
  transitions:
    level: WARNING
