# @package _global_

assets_dir: third_party/auto-atomic-operation/assets
model_name: demo

# remove the env field since the env is created by the demonstrator
managers:
  self_manager:
    _target_: airdc.managers.basis.SelfManager
    on_reach: abandon
  auto_atom:
    _target_: airdc.managers.auto_atom.AutoAtomManager
    env: null
    backend: auto_atom.backend.mjc.mujoco_backend.build_mujoco_backend
    # operators:
    #   - name: arm
    task:
      env_name: mujoco_env

scene_name: ${task_name}

demonstrator:
  component:
    model_path: ${assets_dir}/xmls/scenes/${scene_name}/${model_name}.xml
    sim_freq: 600
    update_freq: 30
    env:
      _target_: builtins.dict

sampler:
  task_info:
    task_name: ${task_name}
    scene: demo # change field name to background?
