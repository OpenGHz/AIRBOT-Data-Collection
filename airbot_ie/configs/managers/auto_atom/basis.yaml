# @package _global_

defaults:
  - /managers/auto_atom/task: pick_and_place
  - /managers/auto_atom/aao_configs@managers.auto_atom: ${managers/auto_atom/task}
  - /managers/auto_atom/aao_configs@demonstrator.component: ${managers/auto_atom/task}
  - /managers/auto_atom/aao_configs/common_vars
  - _self_

assets_dir: third_party/auto-atomic-operation/assets
# remove the env field since the env is created by the demonstrator
managers:
  self_manager:
    _target_: airdc.managers.basis.SelfManager
    on_reach: abandon
  auto_atom:
    _target_: airdc.managers.auto_atom.AutoAtomManager
    env: null

bg3dgs_name: ${managers.auto_atom.bg3dgs_name}
model_name: ${managers.auto_atom.model_name}
scene_name: ${managers.auto_atom.scene_name}
task_name: ${managers.auto_atom.task_name}
operations: ${demonstrator.component.env.operations}
objects: ${demonstrator.component.env.mask_objects}

demonstrator:
  component:
    env:
      _target_: builtins.dict

sampler:
  task_info:
    task_name: ${task_name}
    scene: demo # change field name to background?
    skill: ${operations}
    object: ${objects}
