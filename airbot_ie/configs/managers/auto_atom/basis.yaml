# @package _global_

assets_dir: third_party/auto-atomic-operation/assets
model_name: demo

# remove the env field since the env is created by the demonstrator
managers:
  self_manager:
    _target_: airdc.managers.basis.SelfManager
    on_reach: abandon
  auto_atom:
    _target_: airdc.managers.auto_atom.AutoAtomManager
    env:
      env:
        _target_: builtins.dict
    backend: auto_atom.backend.mjc.mujoco_backend.build_mujoco_backend
    # operators:
    #   - name: arm
    task:
      env_name: mujoco_env

scene_name: ${managers.auto_atom.scene_name}
task_name: ${managers.auto_atom.task_name}
gs_dir: ${managers.auto_atom.gs_dir}
operations: ${demonstrator.component.env.operations}
objects: ${demonstrator.component.env.mask_objects}

demonstrator:
  component:
    _target_: airdc.common.systems.mujoco_env.BatchedMujocoEnv
    model_path: ${assets_dir}/xmls/scenes/${scene_name}/${model_name}.xml
    sim_freq: 600
    update_freq: 30
    env:
      _target_: builtins.dict
    interests:
      - ${objects}
      - ${operations}

sampler:
  task_info:
    task_name: ${task_name}
    scene: demo # change field name to background?
    skill: ${operations}
    object: ${objects}
