# @package _global_

project_id: 7

managers:
  auto_atom:
    _target_: airbot_ie.managers.auto_atom.DiscoverAutoAtomDataReplayManager
    max_episodes: 1
    redis_cfg:
      # mode: pubsub
      mode: stream_group
      host: localhost
      port: 6379
      channel: file_path
      stream_key: augment-tasks:${project_id}
      message_buffer: true
    env:
      gaussian_render:
        share_physics: true

sample_limit:
  size: 1000
  # end_round: 300
  rounds: 100000
