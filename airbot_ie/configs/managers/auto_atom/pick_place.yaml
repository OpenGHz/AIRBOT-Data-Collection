# @package _global_

managers:
  auto_atom:
    task:
      env_name: mujoco_env
      simulator: mujoco
      seed: 42
      # Pose randomization applied at each reset.
      # source_block has a free joint so its x/y and yaw are randomised.
      # target_pedestal is a static body (no free joint) — omit it here.
      randomization:
        source_block:
          x: [-0.03, 0.03]
          y: [-0.03, 0.03]
          # yaw: [-0.524, 0.524] # ±30°
          collision_radius: 0.04
        arm:
          x: [-0.015, 0.015]
          y: [-0.015, 0.015]
          z: [-0.015, 0.015]
          # yaw: [-0.087, 0.087]   # ±5°
          collision_radius: 0.15
      stages:
        - name: pick_source
          object: source_block
          operation: pick
          operator: arm
          param:
            pre_move:
              - position: [0.0, 0.0, 0.12]
                orientation: [-0.70710678, 0.70710678, 0.0, 0.0]
                reference: object_world
              - position: [0.0, 0.0, 0.006]
                orientation: [-0.70710678, 0.70710678, 0.0, 0.0]
                reference: object_world
            post_move:
              - position: [0.0, 0.0, 0.2]
                orientation: [-0.70710678, 0.70710678, 0.0, 0.0]
                reference: eef_world
            eef:
              close: true
        - name: place_source
          object: target_pedestal
          operation: place
          operator: arm
          param:
            pre_move:
              - position: [0.0, 0.0, 0.12]
                orientation: [-0.70710678, 0.70710678, 0.0, 0.0]
                reference: object_world
              - position: [0.0, 0.0, 0.058]
                orientation: [-0.70710678, 0.70710678, 0.0, 0.0]
                reference: object_world
            post_move:
              - position: [0.0, 0.0, 0.16]
                orientation: [-0.70710678, 0.70710678, 0.0, 0.0]
                reference: object_world
            eef:
              close: false
