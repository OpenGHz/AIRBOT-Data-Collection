# @package _global_

defaults:
  - override /managers/auto_atom/task: open_door_airbot_play_back_gs
  - override /managers/auto_atom/class: data_replay
  - override /samplers: video
  - _self_

dataset:
  directory: aao_data/door

batch_size: 5

progress_bar: false

job_id: null
job_id_bias: 0

managers:
  auto_atom:
    env:
      warmup: true
      to_numpy: true
      structured: false
      cameras:
        - name: eef_wrist_cam
          width: ${cam_width}
          height: ${cam_height}
          enable_color: ${enable_color}
          enable_depth: ${enable_depth}
          enable_mask: ${enable_mask}
          enable_heat_map: ${enable_heat_map}
          parent_frame: eef_pose
          is_static: false
        - name: env2_cam
          width: ${cam_width}
          height: ${cam_height}
          enable_color: ${enable_color}
          enable_depth: ${enable_depth}
          enable_mask: ${enable_mask}
          enable_heat_map: ${enable_heat_map}
          is_static: true
      enabled_sensors:
        - camera
    # data_dir: third_party/auto-atomic-operation/data/replay
    # reorganized_dir: data/aao_data_reorganized

sampler:
  encoder:
    # cls: mcap_data_loader.serialization.video.nvc.NvcCoder
    cls: mcap_data_loader.serialization.video.pyav.AvCoder
    cfg:
      frame_format: rgb24
      fps: 20

hydra:
  callbacks:
    # Pre-build gsplat's JIT-compiled CUDA extension once in the launcher
    # process so joblib workers don't race on the shared torch_extensions
    # cache (gsplat removes the build-dir lock on every import, which can
    # clobber another worker's in-flight compile and cause `file too short`
    # / missing-lock errors).
    jit_warmup:
      _target_: airdc.callbacks.JitWarmupCallback

  # sweeper:
  #   params:
  #     door_name: door1,door2

  job:
    env_set:
      # Stagger per-job startup to avoid EGL/GPU init races on the same device.
      # Cumulative stagger: job 0->0s, job 1->8s, job 2->12s, job 3->14s,
      # job 4->15s, and +1s per extra job after that.
      _STAGGER: ${sleep_by_num:${hydra:job.num},2,1}
      # set environment variables for Graphics Library
      CUDA_VISIBLE_DEVICES: ${floor_div:${hydra:job.num},2}
      EGL_VISIBLE_DEVICES: ${floor_div:${hydra:job.num},2}
      MUJOCO_EGL_DEVICE_ID: ${floor_div:${hydra:job.num},2}
      EGL_PLATFORM: egl
      MUJOCO_GL: egl
      PYOPENGL_PLATFORM: egl
      __EGL_VENDOR_LIBRARY_FILENAMES: /usr/share/glvnd/egl_vendor.d/10_nvidia.json
      LD_PRELOAD: /usr/lib/x86_64-linux-gnu/libEGL_nvidia.so.0
      NVIDIA_DRIVER_CAPABILITIES: all

cam_width: 640
cam_height: 480
enable_color: true
enable_depth: false
enable_mask: false
enable_heat_map: false
