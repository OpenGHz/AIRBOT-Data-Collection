# @package _global_

defaults:
  - override /managers/auto_atom/task: open_door_airbot_play_back_gs
  - override /managers/auto_atom/class: data_replay
  - override /samplers: video
  - _self_

dataset:
  directory: aao_data/door

batch_size: 14

progress_bar: false

managers:
  auto_atom:
    env:
      to_numpy: false
      structured: false
      cameras:
        - name: env2_cam
          width: ${cam_width}
          height: ${cam_height}
          enable_color: ${enable_color}
          enable_depth: ${enable_depth}
          enable_mask: ${enable_mask}
          enable_heat_map: ${enable_heat_map}
          is_static: true
      enabled_sensors:
        - camera

sampler:
  encoder:
    cls: mcap_data_loader.serialization.video.nvc.NvcCoder
    # cls: mcap_data_loader.serialization.video.pyav.AvCoder
    cfg:
      frame_format: rgb24

hydra:
  sweeper:
    params:
      door_name: door0,door1
  job:
    env_set:
      # set environment variables for Graphics Library
      # CUDA_VISIBLE_DEVICES: ${floor_div:${hydra:job.num},2}
      # EGL_VISIBLE_DEVICES: ${floor_div:${hydra:job.num},2}
      # MUJOCO_EGL_DEVICE_ID: ${floor_div:${hydra:job.num},2}
      EGL_VISIBLE_DEVICES: ${oc.env:CUDA_VISIBLE_DEVICES,0}
      MUJOCO_EGL_DEVICE_ID: ${oc.env:CUDA_VISIBLE_DEVICES,0}
      EGL_PLATFORM: egl
      MUJOCO_GL: egl
      PYOPENGL_PLATFORM: egl
      __EGL_VENDOR_LIBRARY_FILENAMES: /usr/share/glvnd/egl_vendor.d/10_nvidia.json
      LD_PRELOAD: /usr/lib/x86_64-linux-gnu/libEGL_nvidia.so.0
      NVIDIA_DRIVER_CAPABILITIES: all

cam_width: 640
cam_height: 480
enable_color: true
enable_depth: false
enable_mask: false
enable_heat_map: false
