# @package _global_

defaults:
  - override /managers/auto_atom/task: open_door_airbot_play_back_gs
  - override /managers/auto_atom/class: data_replay
  - override /samplers: video
  - _self_

dataset:
  directory: aao_data/door

batch_size: 1

managers:
  auto_atom:
    env:
      structured: false
      cameras:
        - name: env2_cam
          width: ${cam_width}
          height: ${cam_height}
          enable_color: ${enable_color}
          enable_depth: ${enable_depth}
          enable_mask: ${enable_mask}
          enable_heat_map: ${enable_heat_map}
          is_static: true
      enabled_sensors:
        - camera
sampler:
  av_coder:
    frame_format: rgb24

hydra:
  sweeper:
    params:
      door_name: door0,door1
  job:
    env_set:
      # set environment variables for Graphics Library
      CUDA_VISIBLE_DEVICES: ${hydra:job.num}
      EGL_VISIBLE_DEVICES: ${hydra:job.num}
      MUJOCO_EGL_DEVICE_ID: ${hydra:job.num}
      EGL_PLATFORM: egl
      MUJOCO_GL: egl
      PYOPENGL_PLATFORM: egl
      __EGL_VENDOR_LIBRARY_FILENAMES: /usr/share/glvnd/egl_vendor.d/10_nvidia.json
      LD_PRELOAD: /usr/lib/x86_64-linux-gnu/libEGL_nvidia.so.0
      NVIDIA_DRIVER_CAPABILITIES: all

cam_width: 320
cam_height: 240
enable_color: true
enable_depth: false
enable_mask: false
enable_heat_map: false
