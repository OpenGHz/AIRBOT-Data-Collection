# @package _global_

defaults:
  - override /managers/auto_atom/task: open_door_airbot_play_back_gs
  - override /managers/auto_atom/class: data_replay
  - override /samplers: video
  - _self_

dataset:
  directory: aao_data/door

batch_size: 1

managers:
  auto_atom:
    env:
      structured: false
      cameras:
        - name: env2_cam
          width: ${cam_width}
          height: ${cam_height}
          enable_color: ${enable_color}
          enable_depth: ${enable_depth}
          enable_mask: ${enable_mask}
          enable_heat_map: ${enable_heat_map}
          is_static: true
      enabled_sensors:
        - camera
sampler:
  av_coder:
    frame_format: rgb24

hydra:
  sweeper:
    params:
      door_name: door1
      bg3dgs_name: bg0,bg1

cam_width: 320
cam_height: 240
enable_color: true
enable_depth: false
enable_mask: false
enable_heat_map: false
