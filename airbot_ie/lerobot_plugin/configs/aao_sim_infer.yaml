# Policy inference in the auto-atomic-operation (aao) MuJoCo SIM, via
# `mcap-lerobot-infer` (routes to lerobot-rollout). No real hardware.
#
#   pixi run -e infer-aao mcap-lerobot-infer \
#     -c airbot_ie/lerobot_plugin/configs/aao_sim_infer.yaml
#
# Observation = EEF pose (position 3 + orientation xyzw 4 + gripper 1) plus the
# rendered camera frames below. Action = the EEF pose. Match state/action keys,
# task_config, and sim_cameras to whatever the checkpoint was trained on (the
# MCAP eef-pose configs use exactly position+orientation).
env:
  HF_ENDPOINT: "https://hf-mirror.com"
  HF_HUB_DISABLE_XET: "1"

robot:
  type: aao_sim
  task_config: open_door_airbot_play_g2p   # complete aao task (scene + robot + IK)
  operator: arm
  kinematic: false
  substeps: 1
  has_gripper: true
  # position_keys / orientation_keys / gripper_key default to eef.{x,y,z} +
  # eef.{qx,qy,qz,qw} + gripper.pos; override to match the checkpoint's features.
  # Cameras rendered by the sim (MuJoCo offscreen). Map LeRobot image key -> aao
  # camera name; the names must exist in the task_config's env.cameras (the door
  # scene has eef_wrist_cam + env2_cam at 640x352). camera_shape must match.
  sim_cameras:
    observation.images.wrist: eef_wrist_cam
    observation.images.env: env2_cam
  camera_shape: [352, 640, 3]
  mujoco_gl: glfw            # has a display -> GLFW; headless: egl / osmesa

policy:
  path: outputs/train/my_run/checkpoints/last/pretrained_model

task: "pick and place the block"   # same instruction used during data recording
fps: 30
duration: 0                        # 0 = run until interrupted
