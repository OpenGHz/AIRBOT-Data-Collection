# SmolVLA inference on the REAL AIRBOT Play arm, via `mcap-lerobot-infer`.
#
#   pixi run -e smolvla-infer mcap-lerobot-infer \
#     -c airbot_ie/lerobot_plugin/configs/smolvla_infer_real.yaml
#
# Adapt to your setup before running:
#   * robot.url / robot.port  -> your arm's gRPC endpoint.
#   * components              -> must match the state dim the checkpoint was
#                                trained on ([arm]=6, [arm, eef]=7).
#   * cameras                 -> real airdc camera devices. The keys (camera1,
#                                ...) MUST match the image feature keys used in
#                                training (bare names; lerobot prepends
#                                `observation.images.`). Set camera_index / size
#                                to your hardware.
#   * policy.path             -> your trained checkpoint's pretrained_model dir.
# HF model downloads go through the domestic hf-mirror.com (no VPN/proxy needed).
# For a fully offline/air-gapped run, replace these with HF_HUB_OFFLINE: "1" and
# TRANSFORMERS_OFFLINE: "1" to read only the local HF cache.
env:
  HF_ENDPOINT: "https://hf-mirror.com"
  HF_HUB_DISABLE_XET: "1"

# Keep `cameras` as one whole mapping when the yaml is flattened to CLI args
# (robot.cameras is a Dict[str, CameraSpec]; without this it is split into
# args draccus rejects).
preserve_keys: [cameras]

robot:
  type: airbot_play
  url: localhost            # arm gRPC server host
  port: 50051
  components: [arm, eef]    # match training state dim: [arm]=6, [arm, eef]=7
  # Optional: move to a fixed home joint pose on connect (planned, blocks until
  # it arrives) before the policy starts. Length must match components:
  # 6 for [arm], 7 for [arm, eef] (6 arm joints + gripper), same order as the
  # state. Leave commented to start from wherever the arm currently is.
  # initial_pose: [0.0, -0.5, 0.5, 0.0, 0.0, 0.0, 0.02]
  cameras:
    env_camera:
      target: airdc.common.devices.cameras.v4l2.V4L2Camera
      width: 640
      height: 480
      fps: 30
      extra: { camera_index: "usb-0000:00:14.0-1.4" }
    # Add the other camera(s) your checkpoint expects, e.g.:
    follow_camera:
      target: airdc.common.devices.cameras.v4l2.V4L2Camera
      width: 640
      height: 480
      fps: 30
      extra: { camera_index: "usb-0000:00:14.0-2" }

policy:
  path: outputs/train/my_smolvla/checkpoints/last/pretrained_model

# ============================================================================
# Common inference knobs — just edit the value after each key.
# NOTE: rollout runs for a DURATION (seconds), not a step count. duration: 0
# means run forever until you press Ctrl-C.
# ============================================================================
task: "pick and place the block"   # language instruction; use the same one as in training
duration: 0                        # how long to run, in seconds (0 = until Ctrl-C)
fps: 30                            # control loop rate (policy call + robot step per tick)
device: cuda                       # cuda | cpu (falls back to cpu automatically if no GPU)
return_to_initial_position: true   # move the arm back to its start pose when the run ends
display_data: false                # true = live camera/action visualization window (needs a display)
