# Training config for LeRobot SmolVLA (~450M VLA) on an MCAP dataset backend.
# Run with the pixi `smolvla` env:
#
#   pixi run -e smolvla mcap-lerobot-train -c airbot_ie/lerobot_plugin/configs/smolvla_train.yaml
#
# SmolVLA is the lightweight alternative to pi0.5: it fits an 8 GiB GPU
# (inference peaks ~1.1 GiB; training needs more for gradients/optimizer, so keep
# the batch size modest and raise it only if VRAM allows).
#
# How this differs from configs/pi05.yaml:
#   * policy.type is `smolvla`.
#   * SmolVLA normalizes STATE/ACTION with MEAN_STD (pi0.5 uses QUANTILES), so
#     `compute_quantiles` is NOT needed here — mean/std stats are computed by
#     default.
#   * `load_vlm_weights: true` initializes the SmolVLM2 vision-language backbone
#     from pretrained weights (HuggingFaceTB/SmolVLM2-500M-Video-Instruct), while
#     the action expert is trained on your data. This is the recommended
#     fine-tune setup and needs far less data than training the VLM from scratch.
#   * Using `type: smolvla` (rather than `policy.path: lerobot/smolvla_base`) lets
#     make_policy derive input/output features from THIS dataset's states/actions/
#     images, so your own MCAP topics/dims are used as-is. To instead fine-tune
#     the full pretrained SmolVLA weights (backbone + action expert), set
#     `policy.path: lerobot/smolvla_base` — but then the dataset's cameras/state
#     must match the base's contract (camera1/2/3 + 6-dim state).
#
# First run loads the SmolVLM2 backbone from the HF cache; fetch it beforehand
# with:  pixi run -e smolvla smolvla-download-base
#
# Run (same command shape as inference — no wrapper task):
#   pixi run -e smolvla mcap-lerobot-train -c airbot_ie/lerobot_plugin/configs/smolvla_train.yaml

# Process environment for this run. Applied via os.environ.setdefault (a shell
# env var still wins) BEFORE lerobot is imported, and NOT passed to lerobot-train.
# HF_ENDPOINT points model downloads at the domestic hf-mirror.com, so missing
# weights are fetched from the CN mirror (no VPN/proxy, no official huggingface.co
# access needed). HF_HUB_DISABLE_XET is required because the mirror doesn't proxy
# Xet CAS. For a fully offline/air-gapped run instead, add HF_HUB_OFFLINE: "1"
# (and TRANSFORMERS_OFFLINE: "1") to read only the local HF cache.
env:
  HF_ENDPOINT: "https://hf-mirror.com"
  HF_HUB_DISABLE_XET: "1"

# ============================================================================
# Common training knobs — just edit the value after each key.
# ============================================================================
steps: 20000               # total training steps (larger = longer; use ~100 for a smoke test)
save_freq: 5000            # save a checkpoint every N steps (and after the last step)
log_freq: 100              # print a training log line (loss, etc.) every N steps
batch_size: 4              # samples per step (8 GiB-friendly start; raise if VRAM allows)
num_workers: 1             # data-loading worker processes (set 0 first if loading hangs)
output_dir: outputs/train/smolvla   # where outputs/logs/checkpoints are written
seed: 1000                 # random seed (same seed = reproducible run)
# ----------------------------------------------------------------------------
# Usually left as-is:
# save_checkpoint: true    # whether to save checkpoints at all (false = never write)
# resume: false            # continue from an existing checkpoint under output_dir
# ============================================================================

# ============================================================================
# Training curves via Weights & Biases (the ONLY curve backend in this lerobot —
# there is no tensorboard / local-csv). Default mode is `offline`: metrics are
# recorded to <output_dir>/wandb/ with NO network during training. To view them,
# upload a run to the wandb dashboard — one-time `wandb login`, doable mid-run,
# later, or from another networked machine:
#     pixi run -e smolvla wandb login          # key: https://wandb.ai/authorize
#     pixi run -e smolvla wandb sync outputs/train/smolvla/wandb/latest-run
# Training box can reach wandb.ai and you want LIVE curves? set mode: online
# (real-time dashboard, no manual sync). enable: false = no curve logging at all.
# ============================================================================
wandb:
  enable: true               # false = no curves, just the console metrics line
  project: airbot-smolvla    # wandb project that groups your runs
  mode: offline              # offline = local, `wandb sync` to view; online = live dashboard

policy:
  type: smolvla
  push_to_hub: false
  chunk_size: 50           # SmolVLA action horizon
  n_action_steps: 50       # steps to execute; must be <= chunk_size
  load_vlm_weights: true   # init the SmolVLM2 backbone from pretrained weights
  # train_expert_only: true      # freeze the VLM, train only the action expert (cheaper)
  # freeze_vision_encoder: true

dataset:
  root: data
  repo_id: mcap             # loads episodes from data/mcap/*.mcap
  streaming: true

mcap:
  # Topics below match the demo dataset in data/mcap (verified by loading it).
  # observation.state = follow eef pose (position[3] + orientation[4]) + gripper
  # (eef/joint_state/position[1]) -> (8,). Concatenated in THIS list order, so the
  # gripper is the last dim; inference must expose the state in the same order.
  # SmolVLA is a VLA and uses the proprioceptive state; keep it non-empty.
  states:
    - /follow/eef/pose/position
    - /follow/eef/pose/orientation
    - /follow/eef/joint_state/position
  # Images are decoded from the mcap mp4 attachments -> (3, 480, 640) each.
  images:
    - /env_camera/color/image_raw
    - /follow_camera/color/image_raw
  # action = lead eef pose (position[3] + orientation[4]) + gripper
  # (eef/joint_state/position[1]) -> (8,). Same list-order concat as state, so the
  # gripper is the last dim.
  actions:
    - /lead/eef/pose/position
    - /lead/eef/pose/orientation
    - /lead/eef/joint_state/position
  # Language task handling (VLA requirement), same as pi0.5:
  # "metadata" reads the instruction from an MCAP metadata record; "config" uses
  # the static `task` below; "none" disables it.
  task_source: metadata
  task_metadata_name: task_info
  task_field: task_description       # use "task_description_zh" for Chinese prompts
  task: "do the task"                # fallback when metadata is missing (empty here)
