[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lerobot_env_aao_sim"
version = "0.1.0"
description = "LeRobot Env plugin: a gymnasium env over the auto-atomic-operation (aao) MuJoCo simulator, for native success-rate evaluation with `lerobot-eval` (--env.type=aao_sim)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "lerobot",
    "gymnasium",
    "numpy",
]

# LeRobot auto-discovers plugins whose distribution name starts with
# `lerobot_env_`. `--env.type=aao_sim` is registered via
# `@EnvConfig.register_subclass("aao_sim")` in config_aao_sim_env.py.
[tool.hatch.build.targets.wheel]
packages = ["lerobot_env_aao_sim"]
