[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lerobot_robot_airbot_play"
version = "0.1.0"
description = "LeRobot Robot plugin wrapping the AIRBOT Play arm (airbot_ie / airdc System) for LeRobot inference and control."
readme = "README.md"
requires-python = ">=3.10"
# NOTE: `airbot_ie` / `airdc` / `airbot_py` are provided by the parent
# data-collection repo environment (installed editable there), so they are not
# pinned here. `lerobot` must be importable in the same environment.
dependencies = [
    "lerobot",
    "numpy",
]

# LeRobot auto-discovers plugins whose distribution name starts with
# `lerobot_robot_`. The `--robot.type=airbot_play` choice is registered via the
# `@RobotConfig.register_subclass("airbot_play")` decorator in
# `config_airbot_play.py`, exposed through the package `__init__`.
[tool.hatch.build.targets.wheel]
packages = ["lerobot_robot_airbot_play"]
