[workspace]
authors = ["Haizhou Ge <1352674740@qq.com>"]
# Default to a domestic (CN) conda-forge mirror, with upstream conda-forge as
# fallback. Order = priority: the Tsinghua mirror is tried first.
channels = [
    "https://mirrors.tuna.tsinghua.edu.cn/anaconda/cloud/conda-forge/",
    "conda-forge",
]
name = "airdc"
platforms = ["linux-64"]
version = "0.1.0"

# Default to domestic (CN) PyPI mirrors for all pypi-dependencies.
[pypi-options]
# In uv/pixi, `extra-index-urls` take PRIORITY over `index-url` (index-url is the
# lowest-priority fallback, defaulting to official PyPI when omitted). So the CN
# mirrors we actually want to serve packages live in extra-index-urls, in
# priority order; the omitted index-url leaves official PyPI as the last resort.
#   effective order: USTC -> Aliyun -> pypi.org (default fallback)
# Note: use the 301 TARGET host `mirrors.ustc.edu.cn/pypi/simple`, NOT
# `pypi.mirrors.ustc.edu.cn/simple` (the latter 301-redirects).
extra-index-urls = [
    "https://mirrors.ustc.edu.cn/pypi/simple",
    "https://mirrors.aliyun.com/pypi/simple/",
]

[tasks]
download-gs = "hf download OpenGHz/auto-atom-assets --repo-type=dataset --include 'assets/gs/*' --local-dir third_party/auto-atomic-operation/"
# Software tests only: hardware/service-dependent cases auto-skip via conftest probes.
test = "pytest -m software"
# Force-run hardware/service tests (needs a real device or running service).
test-hardware = "pytest -m hardware --run-hardware"
# Everything collectable (hardware cases still auto-skip when absent).
test-all = "pytest"

# ---------------------------------------------------------------------------
# Default feature: non-ROS dependencies (kept lean; usable without robostack).
# ---------------------------------------------------------------------------
[dependencies]
huggingface_hub = "*"
hydra-joblib-launcher = "*"
socksio = "*"
# Test tooling (lightweight; kept in the default feature so `pixi run test`
# uses the in-env python across all environments instead of a stray system one).
pytest = "*"
natsort = "*"

# opencv = ">=4.5.0,<5"
# matplotlib = ">=3.10.8,<4"

[pypi-dependencies]
httpx = { extras = ["socks"] }
airdc = { path = ".", extras = ["assis"], editable = true }
# Editable during development so fixes to mcap_lerobot (train/infer) take effect
# without reinstall. Provides the mcap-data-loader that airdc (>=0.3.1) requires;
# base deps are light (no torch/lerobot — those are imported lazily).
# mcap-data-loader = { path = "third_party/MCAP-DataLoader", editable = true }
redis = "*"
PyNvVideoCodec = "*"

# ---------------------------------------------------------------------------
# ROS feature: robostack-jazzy stack. Isolated from the default environment so
# non-ROS workflows (e.g. LeRobot inference) don't pull the ROS toolchain.
# The robostack channel is scoped here and given higher priority than
# conda-forge so ROS packages resolve from robostack (original behavior).
# ---------------------------------------------------------------------------
[feature.ros]
channels = [{ channel = "robostack-jazzy", priority = 1 }]

[feature.ros.dependencies]
ros-jazzy-ros-core = ">=0.11.0,<0.12"
genpy = ">=2022.1,<2023"
ros-jazzy-foxglove-msgs = ">=3.2.4,<4"
# ros-jazzy-cv-bridge = ">=4.1.0,<5"

[feature.ros.pypi-dependencies]
mcap-ros2idl-support = "*"

# ---------------------------------------------------------------------------
# mlbase feature: the shared LeRobot + PyTorch base that the infer-* / pi05 /
# smolvla envs all build on (extracted to avoid repeating torch/lerobot/pins).
#   - lerobot requires python >=3.12 (matches the pixi env), which is why the
#     py3.10 conda env cannot run it.
#   - lerobot pins setuptools <81 and packaging <26; conda-forge would otherwise
#     pin newer ones and the pypi solve would fail against those.
#   - torch/torchvision are steered to a PyTorch CUDA 12.8 wheel index (here the
#     NJU domestic mirror) via `[feature.mlbase.pypi-options.dependency-overrides]`
#     below. cu128 is verified working on this 12.4 driver via CUDA minor-version
#     compatibility.
#   - lerobot is installed from PyPI here with no extras; downstream features add
#     extras (e.g. [pi,peft], [smolvla]) as needed and pixi unions them per env.
# ---------------------------------------------------------------------------
[feature.mlbase]
platforms = ["linux-64"]

[feature.mlbase.dependencies]
python = ">=3.12,<3.13"
setuptools = ">=71.0.0,<81"
packaging = ">=24.2,<26"

[feature.mlbase.pypi-dependencies]
# torch/torchvision are NOT listed as direct deps: lerobot (below) is a PyTorch
# policy library that pulls them into the graph transitively with the same
# version ranges, and the override below then steers them to the NJU mirror. A
# dependency-override only *steers* a package already in the graph — it does not
# introduce one — so lerobot must stay a real dependency here.
lerobot = ">=0.6.0"

# Force torch/torchvision to resolve from the NJU CUDA 12.8 mirror everywhere in
# the graph (they enter via lerobot). Using dependency-overrides (rather than a
# per-dep `index=`) steers the resolution regardless of what any dependency
# declares, so it also covers torch pulled transitively by lerobot's extras.
# https://pixi.prefix.dev/latest/advanced/override/
[feature.mlbase.pypi-options.dependency-overrides]
torch = { version = ">=2.7,<2.12", index = "https://mirrors.nju.edu.cn/pytorch/whl/cu128" }
torchvision = { version = ">=0.22,<0.27", index = "https://mirrors.nju.edu.cn/pytorch/whl/cu128" }

# ---------------------------------------------------------------------------
# airbotpy feature: JUST the airbot_py arm SDK — a pure-python (py3-none-any)
# wheel vendored under airbot_ie/deps/. It is light (only grpcio + typeguard at
# runtime), so it is shared by BOTH the data-collection env (`collect`, which
# talks to the arm over airbot_py's grpc backend) and the on-arm inference envs,
# WITHOUT dragging in lerobot. Kept as a pixi feature (native relative path dep)
# rather than an airdc[airbot] extra: a relative `file:` URL baked into airdc's
# built wheel metadata can't be resolved by uv during a solve ("relative path
# without a working directory"), whereas pixi resolves this path from the
# manifest directory just fine.
# ---------------------------------------------------------------------------
[feature.airbotpy.pypi-dependencies]
airbot_py = { path = "airbot_ie/deps/airbot_py-5.1.6-py3-none-any.whl" }

# ---------------------------------------------------------------------------
# airbot feature (delta over mlbase + airbotpy): the LeRobot plugin that makes
# `--robot.type=airbot_play` discoverable, for running a policy on the real arm.
#   - lerobot_robot_airbot_play depends on `lerobot`, so this feature must stay
#     OUT of the `collect` env: lerobot pulls opencv-python-headless, which
#     collides with airdc[cv2]'s opencv-python (both provide `cv2`). The airbot_py
#     SDK it imports comes from the separate `airbotpy` feature above.
#   - airdc[v4l2] adds camera I/O (linuxpy/PyTurboJPEG) to the inference envs.
# ---------------------------------------------------------------------------
[feature.airbot.pypi-dependencies]
lerobot_robot_airbot_play = { path = "airbot_ie/lerobot_plugin/lerobot_robot_airbot_play", editable = true }
airdc = { path = ".", extras = ["v4l2"], editable = true }
# pyrealsense2 = "*"

# ---------------------------------------------------------------------------
# ledata feature (delta over mlbase): the shared lerobot DATASET stack. Required
# by BOTH training (mcap-lerobot-train) AND inference (mcap-lerobot-infer ->
# lerobot.rollout imports `datasets` at module load), so every train/infer env
# composes it. Extracted so those features don't each repeat datasets/av/etc.
#   - the non-torchcodec parts of lerobot's [dataset] extra
#     (datasets/pandas/pyarrow/av/jsonlines) are added explicitly. torchcodec is
#     intentionally omitted — its prebuilt .so needs a specific FFmpeg and raises
#     an OSError lerobot's guard can't catch; PyAV decodes video instead.
#   - mcap-data-loader (provides `mcap_lerobot_train`/`infer` + McapLeRobotDataset)
#     comes transitively via airdc (editable), so no extra install is needed.
# ---------------------------------------------------------------------------
[feature.ledata.dependencies]
hydra-core = "*"
# datasets (<5) caps fsspec<=2026.2.0; conda-forge would otherwise pin a newer
# one (pulled via huggingface_hub) and the pypi solve would fail against it.
fsspec = ">=2023.1.0,<=2026.2.0"

[feature.ledata.pypi-dependencies]
datasets = ">=4.7.0,<5.0.0"
pandas = ">=2.0.0,<3.0.0"
pyarrow = ">=21.0.0,<30.0.0"
av = ">=15.0.0,<16.0.0"
jsonlines = ">=4.0.0,<5.0.0"

# ---------------------------------------------------------------------------
# pi05 feature (delta over mlbase+ledata): pi0.5 (LoRA) policy. Migrated from
# third_party/MCAP-DataLoader/setup_pi05_server.sh (the server-only hacks there —
# pip mirror config, hf_xet/flash_attn/torchcodec uninstalls, numpy==1.26.4 pin —
# are dropped; they worked around a blocked mirror + numpy-1 opencv wheels, and
# numpy 1.26 is anyway incompatible with lerobot 0.6.1's numpy>=2 pin here).
# NOTE: pi0.5 is ~3.6B params (~7.8 GiB bf16 on GPU) and does NOT fit an 8 GiB
# card — use SmolVLA below for a lightweight (~450M) option on small GPUs.
#   - lerobot[pi,peft] adds transformers + peft on top of mlbase's base lerobot.
# ---------------------------------------------------------------------------
[feature.pi05.pypi-dependencies]
lerobot = { version = ">=0.6.0", extras = ["pi", "peft"] }

# pi0.5 tasks. The model artifacts below are the only non-package installs from
# setup_pi05_server.sh; the rest of that script was server-specific pip/mirror/
# uninstall hacks, already dropped.
#   HF downloads default to the hf-mirror.com endpoint with Xet disabled (the
#   mirror doesn't proxy Xet CAS) — override HF_ENDPOINT to use hf.co directly.
#   Weights land in the standard HF cache (~/.cache/huggingface), or set HF_HOME.
[feature.pi05.tasks.pi05-download-base]
description = "Download pi05_base weights (~14.5G) from HuggingFace"
cmd = "python -c \"from huggingface_hub import snapshot_download; print('pi05_base at', snapshot_download('lerobot/pi05_base'))\""
env = { HF_ENDPOINT = "https://hf-mirror.com", HF_HUB_DISABLE_XET = "1" }

[feature.pi05.tasks.pi05-download-tokenizer]
description = "Download the gated PaliGemma tokenizer (needs HF_TOKEN with license accepted, or provide it out-of-band)"
cmd = "python -c \"from huggingface_hub import snapshot_download; print('tokenizer at', snapshot_download('google/paligemma-3b-pt-224', allow_patterns=['tokenizer*','special_tokens_map.json','added_tokens.json','config.json']))\""
env = { HF_ENDPOINT = "https://hf-mirror.com", HF_HUB_DISABLE_XET = "1" }

[feature.pi05.tasks.pi05-setup]
description = "Fetch all pi0.5 model artifacts (base weights + tokenizer)"
depends-on = ["pi05-download-base", "pi05-download-tokenizer"]

[feature.pi05.tasks.pi05-check]
description = "Offline self-check: import the full pi0.5 training stack and report versions"
env = { HF_HUB_OFFLINE = "1", TRANSFORMERS_OFFLINE = "1" }
cmd = """python -c "import torch, cv2, hydra, datasets, av, transformers, peft; from lerobot.policies import PreTrainedPolicy; from mcap_data_loader.datasets.mcap_lerobot import McapLeRobotDataset; print('SELF-CHECK OK | cuda', torch.cuda.is_available(), '| torch', torch.__version__, '| transformers', transformers.__version__, '| datasets', datasets.__version__)" """

# NOTE: no `pi05-train` task — training is driven the same way as inference, with
# a plain command + config: `pixi run -e pi05 mcap-lerobot-train -c <config>.yaml`.
# Run-time env vars (WANDB_MODE, HF_HUB_OFFLINE, ...) live in the config's `env:`
# block, so no wrapper task is needed.

# ---------------------------------------------------------------------------
# smolvla feature (delta over mlbase+ledata): SmolVLA, HF's lightweight (~450M)
# VLA — the small-GPU-friendly alternative to pi0.5. smolvla_base is ~907 MB on
# disk (~0.45 GiB bf16 on GPU), so it fits an 8 GiB card with room to spare.
#   - lerobot[smolvla] adds transformers + accelerate + num2words on top of
#     mlbase's base lerobot (transformers/accelerate overlap pi05's, unioned by
#     pixi). SmolVLA's SmolLM2 tokenizer is public (not gated like PaliGemma).
#   - train/infer use the same entrypoints as pi0.5 (mcap_lerobot_train /
#     mcap-lerobot-infer -> lerobot-train / lerobot-rollout); only the config's
#     `policy.type`/`policy.path` differ, so no code changes are needed.
# ---------------------------------------------------------------------------
[feature.smolvla.pypi-dependencies]
lerobot = { version = ">=0.6.0", extras = ["smolvla"] }

[feature.smolvla.tasks.smolvla-download-base]
description = "Download smolvla_base (~907MB) + its SmolVLM2 backbone (~500M) from HuggingFace"
# SmolVLA loads two public repos: the policy weights (lerobot/smolvla_base) and
# its VLM backbone (HuggingFaceTB/SmolVLM2-500M-Video-Instruct, pulled by
# transformers at model-build time). Both must be cached for offline inference.
cmd = "python -c \"from huggingface_hub import snapshot_download; print('smolvla_base at', snapshot_download('lerobot/smolvla_base')); print('vlm backbone at', snapshot_download('HuggingFaceTB/SmolVLM2-500M-Video-Instruct'))\""
env = { HF_ENDPOINT = "https://hf-mirror.com", HF_HUB_DISABLE_XET = "1" }

[feature.smolvla.tasks.smolvla-setup]
description = "Fetch all SmolVLA model artifacts (base weights + SmolVLM2 backbone)"
# Parity with pi05-setup so docs can use a uniform `$POLICY-setup`. SmolVLA has
# no gated tokenizer step, so this is just the base download.
depends-on = ["smolvla-download-base"]

[feature.smolvla.tasks.smolvla-check]
description = "Offline self-check: import the SmolVLA training stack and report versions"
env = { HF_HUB_OFFLINE = "1", TRANSFORMERS_OFFLINE = "1" }
cmd = """python -c "import torch, cv2, hydra, datasets, av, transformers, num2words; from lerobot.policies.smolvla.modeling_smolvla import SmolVLAPolicy; from mcap_data_loader.datasets.mcap_lerobot import McapLeRobotDataset; print('SMOLVLA SELF-CHECK OK | cuda', torch.cuda.is_available(), '| torch', torch.__version__, '| transformers', transformers.__version__)" """

# ---------------------------------------------------------------------------
# collect feature: the data-collection environment. This is the pixi equivalent
# of `bash install/install.sh` (system deps + `pip install -e .[all,airbot]`):
#   - airdc[all,airbot] editable = the full data-collection stack (basic/cfg/soft/
#     hard/cv2 + ruamel.yaml), i.e. hardware I/O (pynput/linuxpy/pyudev/
#     PyTurboJPEG), opencv, config tooling.
#   - libjpeg-turbo (conda) provides libturbojpeg.so that PyTurboJPEG loads at
#     runtime — the conda replacement for the apt `libturbojpeg` package, so no
#     sudo/apt is needed.
# Kept as a SEPARATE environment (not composed with mlbase) on purpose: airdc[cv2]
# pulls opencv-python, which collides with lerobot's opencv-python-headless in the
# ML envs (both provide the cv2 module). Data collection and policy inference
# therefore live in different environments.
# ---------------------------------------------------------------------------
[feature.collect.dependencies]
libjpeg-turbo = "*"       # libturbojpeg.so for PyTurboJPEG (apt equivalent: libturbojpeg)

[feature.collect.pypi-dependencies]
airdc = { path = ".", extras = ["all", "airbot"], editable = true }

# ---------------------------------------------------------------------------
# aao feature: auto-atomic-operation — the MuJoCo (physics) + Gaussian-splatting
# (gs) simulation stack. Kept OUT of the default environment (it pulls heavy
# sim/render deps like mujoco + gsplat) and composed only where auto-atom is
# actually needed: the `ros` env and the `infer-aao` env.
# ---------------------------------------------------------------------------
[feature.aao.pypi-dependencies]
auto-atomic-operation = { path = "third_party/auto-atomic-operation", extras = [
    "mujoco",
    "gs",
], editable = true }
# LeRobot Robot plugin to run a policy in the aao MuJoCo sim (state-only, EEF
# pose). Editable so `--robot.type=aao_sim` is discoverable in infer-aao.
lerobot_robot_aao_sim = { path = "airbot_ie/lerobot_plugin/lerobot_robot_aao_sim", editable = true }

# ---------------------------------------------------------------------------
# Environments (mlbase = shared torch + lerobot base; ledata = shared dataset
# stack; default is implicit in all)
#   - default:       base (non-ROS) deps only.
#   - collect:       data-collection stack (airdc[all,airbot] + libturbojpeg +
#                    airbot_py SDK via the `airbotpy` feature); the pixi
#                    replacement for `bash install/install.sh`.
#   - ros:           base + ROS stack + aao (for ROS samplers / ROS workflows).
#   - infer-airbot:  mlbase + AIRBOT Play robot stack (run a LeRobot policy on the
#                    real arm).
#   - infer-aao:     mlbase + aao stack (auto-atom MuJoCo/gs) — run a LeRobot
#                    policy in simulation, no real hardware.
#   - pi05:          mlbase + ledata + pi0.5 policy (train). ~3.6B, needs a big GPU.
#   - pi05-infer:    pi05 + airbot robot, i.e. run a trained pi0.5 policy on the arm.
#   - smolvla:       mlbase + ledata + SmolVLA policy (train). ~450M, fits 8 GiB.
#   - smolvla-infer: smolvla + airbot robot, i.e. run a trained SmolVLA policy on the arm.
# lerobot extras are unioned per environment by pixi.
# ---------------------------------------------------------------------------
[environments]
# `airbotpy` gives the data-collection env the airbot_py arm SDK (grpc backend)
# without the lerobot plugin (which lives in the `airbot` feature).
collect = ["collect", "airbotpy"]
ros = ["ros", "aao"]
# `ledata` carries the lerobot dataset stack (datasets/pandas/av/...), which
# `lerobot.rollout` (= what mcap-lerobot-infer runs) requires at import — not
# just training. So every inference env needs it too.
# `airbotpy` provides the airbot_py SDK; `airbot` adds the lerobot plugin on top.
infer-airbot = ["mlbase", "ledata", "airbotpy", "airbot"]
infer-aao = ["mlbase", "ledata", "aao"]
pi05 = ["mlbase", "ledata", "pi05"]
pi05-infer = ["mlbase", "ledata", "airbotpy", "airbot", "pi05"]
smolvla = ["mlbase", "ledata", "smolvla"]
smolvla-infer = ["mlbase", "ledata", "airbotpy", "airbot", "smolvla"]
