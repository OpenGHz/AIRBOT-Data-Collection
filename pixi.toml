[workspace]
authors = ["Haizhou Ge <1352674740@qq.com>"]
channels = ["conda-forge"]
name = "airdc"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
download-gs = "hf download OpenGHz/auto-atom-assets --repo-type=dataset --include 'assets/gs/*' --local-dir third_party/auto-atomic-operation/"
# Software tests only: hardware/service-dependent cases auto-skip via conftest probes.
test = "pytest -m software"
# Force-run hardware/service tests (needs a real device or running service).
test-hardware = "pytest -m hardware --run-hardware"
# Everything collectable (hardware cases still auto-skip when absent).
test-all = "pytest"

# ---------------------------------------------------------------------------
# Default feature: non-ROS dependencies (kept lean; usable without robostack).
# ---------------------------------------------------------------------------
[dependencies]
huggingface_hub = "*"
hydra-joblib-launcher = "*"
socksio = "*"
# Test tooling (lightweight; kept in the default feature so `pixi run test`
# uses the in-env python across all environments instead of a stray system one).
pytest = "*"
natsort = "*"

# opencv = ">=4.5.0,<5"
# matplotlib = ">=3.10.8,<4"

[pypi-dependencies]
httpx = { extras = ["socks"] }
airdc = { path = ".", extras = ["assis"], editable = true }
auto-atomic-operation = { path = "third_party/auto-atomic-operation", extras = [
    "mujoco",
    "gs",
], editable = true }
# mcap-data-loader = { path = "third_party/MCAP-DataLoader", editable = true }
redis = "*"
PyNvVideoCodec = "*"

# ---------------------------------------------------------------------------
# ROS feature: robostack-jazzy stack. Isolated from the default environment so
# non-ROS workflows (e.g. LeRobot inference) don't pull the ROS toolchain.
# The robostack channel is scoped here and given higher priority than
# conda-forge so ROS packages resolve from robostack (original behavior).
# ---------------------------------------------------------------------------
[feature.ros]
channels = [{ channel = "robostack-jazzy", priority = 1 }]

[feature.ros.dependencies]
ros-jazzy-ros-core = ">=0.11.0,<0.12"
genpy = ">=2022.1,<2023"
ros-jazzy-foxglove-msgs = ">=3.2.4,<4"
# ros-jazzy-cv-bridge = ">=4.1.0,<5"

[feature.ros.pypi-dependencies]
mcap-ros2idl-support = "*"

# ---------------------------------------------------------------------------
# mlbase feature: the shared LeRobot + PyTorch base that infer / pi05 / pi05-infer
# all build on (extracted to avoid repeating torch/lerobot/pins in each).
#   - lerobot requires python >=3.12 (matches the pixi env), which is why the
#     py3.10 conda env cannot run it.
#   - lerobot 0.6.1 pins setuptools <81 and packaging <26; conda-forge would
#     otherwise pin newer ones and the pypi solve would fail against those.
#   - torch/torchvision are pinned to the PyTorch CUDA 12.8 index (pixi does not
#     read a path-dependency's own `[tool.uv.sources]`, so we pin here to mirror
#     lerobot's pyproject). cu128 is verified working on this 12.4 driver via
#     CUDA minor-version compatibility.
#   - lerobot is the vendored third_party/lerobot, installed editable with no
#     extras here; downstream features add extras (e.g. [pi,peft]) as needed and
#     pixi unions them per environment.
# ---------------------------------------------------------------------------
[feature.mlbase]
platforms = ["linux-64"]

[feature.mlbase.dependencies]
python = ">=3.12,<3.13"
setuptools = ">=71.0.0,<81"
packaging = ">=24.2,<26"

[feature.mlbase.pypi-dependencies]
torch = { version = ">=2.7,<2.12", index = "https://download.pytorch.org/whl/cu128" }
torchvision = { version = ">=0.22,<0.27", index = "https://download.pytorch.org/whl/cu128" }
lerobot = { path = "third_party/lerobot", editable = true }

# ---------------------------------------------------------------------------
# Infer feature (delta over mlbase): the AIRBOT Play robot stack for running a
# LeRobot policy on the arm.
#   - airbot_py is a pure-python (py3-none-any) wheel vendored under
#     airbot_ie/deps/ (shared across airbot_ie, not plugin-specific).
#   - the plugin package (lerobot_robot_airbot_play) is installed editable so
#     `--robot.type=airbot_play` is discoverable.
# ---------------------------------------------------------------------------
[feature.infer.pypi-dependencies]
airbot_py = { path = "airbot_ie/deps/airbot_py-5.1.6-py3-none-any.whl" }
lerobot_robot_airbot_play = { path = "airbot_ie/lerobot_plugin/lerobot_robot_airbot_play", editable = true }
airdc = { path = ".", extras = ["v4l2"], editable = true }
# pyrealsense2 = "*"

# ---------------------------------------------------------------------------
# letrain feature (delta over mlbase): the shared "train a lerobot policy from an
# MCAP dataset" data stack, common to pi0.5 and SmolVLA (and any future VLA).
# Extracted so the two policy features don't each repeat datasets/av/etc.
#   - the non-torchcodec parts of lerobot's [dataset] extra
#     (datasets/pandas/pyarrow/av/jsonlines) are added explicitly. torchcodec is
#     intentionally omitted — its prebuilt .so needs a specific FFmpeg and raises
#     an OSError lerobot's guard can't catch; PyAV decodes video instead.
#   - mcap-data-loader (provides `mcap_lerobot_train`/`infer` + McapLeRobotDataset)
#     comes transitively via airdc (editable), so no extra install is needed.
# ---------------------------------------------------------------------------
[feature.letrain.dependencies]
hydra-core = "*"
# datasets (<5) caps fsspec<=2026.2.0; conda-forge would otherwise pin a newer
# one (pulled via huggingface_hub) and the pypi solve would fail against it.
fsspec = ">=2023.1.0,<=2026.2.0"

[feature.letrain.pypi-dependencies]
datasets = ">=4.7.0,<5.0.0"
pandas = ">=2.0.0,<3.0.0"
pyarrow = ">=21.0.0,<30.0.0"
av = ">=15.0.0,<16.0.0"
jsonlines = ">=4.0.0,<5.0.0"

# ---------------------------------------------------------------------------
# pi05 feature (delta over mlbase+letrain): pi0.5 (LoRA) policy. Migrated from
# third_party/MCAP-DataLoader/setup_pi05_server.sh (the server-only hacks there —
# pip mirror config, hf_xet/flash_attn/torchcodec uninstalls, numpy==1.26.4 pin —
# are dropped; they worked around a blocked mirror + numpy-1 opencv wheels, and
# numpy 1.26 is anyway incompatible with lerobot 0.6.1's numpy>=2 pin here).
# NOTE: pi0.5 is ~3.6B params (~7.8 GiB bf16 on GPU) and does NOT fit an 8 GiB
# card — use SmolVLA below for a lightweight (~450M) option on small GPUs.
#   - lerobot[pi,peft] adds transformers + peft on top of mlbase's base lerobot.
# ---------------------------------------------------------------------------
[feature.pi05.pypi-dependencies]
lerobot = { path = "third_party/lerobot", editable = true, extras = ["pi", "peft"] }

# pi0.5 tasks. The model artifacts below are the only non-package installs from
# setup_pi05_server.sh; the rest of that script was server-specific pip/mirror/
# uninstall hacks, already dropped.
#   HF downloads default to the hf-mirror.com endpoint with Xet disabled (the
#   mirror doesn't proxy Xet CAS) — override HF_ENDPOINT to use hf.co directly.
#   Weights land in the standard HF cache (~/.cache/huggingface), or set HF_HOME.
[feature.pi05.tasks.pi05-download-base]
description = "Download pi05_base weights (~14.5G) from HuggingFace"
cmd = "python -c \"from huggingface_hub import snapshot_download; print('pi05_base at', snapshot_download('lerobot/pi05_base'))\""
env = { HF_ENDPOINT = "https://hf-mirror.com", HF_HUB_DISABLE_XET = "1" }

[feature.pi05.tasks.pi05-download-tokenizer]
description = "Download the gated PaliGemma tokenizer (needs HF_TOKEN with license accepted, or provide it out-of-band)"
cmd = "python -c \"from huggingface_hub import snapshot_download; print('tokenizer at', snapshot_download('google/paligemma-3b-pt-224', allow_patterns=['tokenizer*','special_tokens_map.json','added_tokens.json','config.json']))\""
env = { HF_ENDPOINT = "https://hf-mirror.com", HF_HUB_DISABLE_XET = "1" }

[feature.pi05.tasks.pi05-setup]
description = "Fetch all pi0.5 model artifacts (base weights + tokenizer)"
depends-on = ["pi05-download-base", "pi05-download-tokenizer"]

[feature.pi05.tasks.pi05-check]
description = "Offline self-check: import the full pi0.5 training stack and report versions"
env = { HF_HUB_OFFLINE = "1", TRANSFORMERS_OFFLINE = "1" }
cmd = """python -c "import torch, cv2, hydra, datasets, av, transformers, peft; from lerobot.policies import PreTrainedPolicy; from mcap_data_loader.datasets.mcap_lerobot import McapLeRobotDataset; print('SELF-CHECK OK | cuda', torch.cuda.is_available(), '| torch', torch.__version__, '| transformers', transformers.__version__, '| datasets', datasets.__version__)" """

# NOTE: no `pi05-train` task — training is driven the same way as inference, with
# a plain command + config: `pixi run -e pi05 mcap-lerobot-train -c <config>.yaml`.
# Run-time env vars (WANDB_MODE, HF_HUB_OFFLINE, ...) live in the config's `env:`
# block, so no wrapper task is needed.

# ---------------------------------------------------------------------------
# smolvla feature (delta over mlbase+letrain): SmolVLA, HF's lightweight (~450M)
# VLA — the small-GPU-friendly alternative to pi0.5. smolvla_base is ~907 MB on
# disk (~0.45 GiB bf16 on GPU), so it fits an 8 GiB card with room to spare.
#   - lerobot[smolvla] adds transformers + accelerate + num2words on top of
#     mlbase's base lerobot (transformers/accelerate overlap pi05's, unioned by
#     pixi). SmolVLA's SmolLM2 tokenizer is public (not gated like PaliGemma).
#   - train/infer use the same entrypoints as pi0.5 (mcap_lerobot_train /
#     mcap-lerobot-infer -> lerobot-train / lerobot-rollout); only the config's
#     `policy.type`/`policy.path` differ, so no code changes are needed.
# ---------------------------------------------------------------------------
[feature.smolvla.pypi-dependencies]
lerobot = { path = "third_party/lerobot", editable = true, extras = ["smolvla"] }

[feature.smolvla.tasks.smolvla-download-base]
description = "Download smolvla_base (~907MB) + its SmolVLM2 backbone (~500M) from HuggingFace"
# SmolVLA loads two public repos: the policy weights (lerobot/smolvla_base) and
# its VLM backbone (HuggingFaceTB/SmolVLM2-500M-Video-Instruct, pulled by
# transformers at model-build time). Both must be cached for offline inference.
cmd = "python -c \"from huggingface_hub import snapshot_download; print('smolvla_base at', snapshot_download('lerobot/smolvla_base')); print('vlm backbone at', snapshot_download('HuggingFaceTB/SmolVLM2-500M-Video-Instruct'))\""
env = { HF_ENDPOINT = "https://hf-mirror.com", HF_HUB_DISABLE_XET = "1" }

[feature.smolvla.tasks.smolvla-setup]
description = "Fetch all SmolVLA model artifacts (base weights + SmolVLM2 backbone)"
# Parity with pi05-setup so docs can use a uniform `$POLICY-setup`. SmolVLA has
# no gated tokenizer step, so this is just the base download.
depends-on = ["smolvla-download-base"]

[feature.smolvla.tasks.smolvla-check]
description = "Offline self-check: import the SmolVLA training stack and report versions"
env = { HF_HUB_OFFLINE = "1", TRANSFORMERS_OFFLINE = "1" }
cmd = """python -c "import torch, cv2, hydra, datasets, av, transformers, num2words; from lerobot.policies.smolvla.modeling_smolvla import SmolVLAPolicy; from mcap_data_loader.datasets.mcap_lerobot import McapLeRobotDataset; print('SMOLVLA SELF-CHECK OK | cuda', torch.cuda.is_available(), '| torch', torch.__version__, '| transformers', transformers.__version__)" """

# ---------------------------------------------------------------------------
# Environments (mlbase = shared torch + lerobot base; letrain = shared dataset
# stack; default is implicit in all)
#   - default:       base (non-ROS) deps only.
#   - ros:           base + ROS stack (for ROS samplers / ROS-dependent workflows).
#   - infer:         mlbase + AIRBOT Play robot stack (run a LeRobot policy on the arm).
#   - pi05:          mlbase + letrain + pi0.5 policy (train). ~3.6B, needs a big GPU.
#   - pi05-infer:    pi05 + robot, i.e. run a trained pi0.5 policy on the arm.
#   - smolvla:       mlbase + letrain + SmolVLA policy (train). ~450M, fits 8 GiB.
#   - smolvla-infer: smolvla + robot, i.e. run a trained SmolVLA policy on the arm.
# lerobot extras are unioned per environment by pixi.
# ---------------------------------------------------------------------------
[environments]
ros = ["ros"]
infer = ["mlbase", "infer"]
pi05 = ["mlbase", "letrain", "pi05"]
pi05-infer = ["mlbase", "letrain", "infer", "pi05"]
smolvla = ["mlbase", "letrain", "smolvla"]
smolvla-infer = ["mlbase", "letrain", "infer", "smolvla"]
